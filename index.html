<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>興嘉學習大冒險 V2.2</title>
<style>
:root{--ink:#172033;--blue:#2563eb;--gold:#f4b942;--green:#16a34a;--red:#dc2626;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(#dff3ff,#f8fbff 45%,#fff7e6);color:var(--ink);min-height:100vh}.app{max-width:1220px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#13213a,#2d62a9);color:#fff;padding:24px;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 16px 36px #1e477530}.hero:after{content:"⚔️ 🐉 🏆";position:absolute;right:18px;top:14px;font-size:60px;opacity:.18}.hero h1{margin:0;font-size:clamp(28px,5vw,48px)}.hero p{margin:8px 0 0;color:#dbeafe}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.nav button{background:#fff;box-shadow:0 4px 12px #0001}.primary{background:var(--blue);color:#fff}.gold{background:var(--gold);color:#4b3500}.green{background:var(--green);color:#fff}.danger{background:#fee2e2;color:#991b1b}.soft{background:#eaf2ff;color:#1d4ed8}.card{background:#fff;border:1px solid #e7eef8;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #1f4b7d12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:820px){.grid,.grid3{grid-template-columns:1fr}}label{display:block;font-weight:800;margin:9px 0 5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}@media(max-width:850px){.stats{grid-template-columns:repeat(3,1fr)}}.stat{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 5px 16px #0000000d}.stat b{display:block;font-size:20px}.map{display:flex;align-items:center;gap:8px;overflow:auto;padding:14px 0}.node{min-width:88px;text-align:center}.circle{width:65px;height:65px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dce8f5;border:4px solid #fff;box-shadow:0 4px 11px #0002;font-size:27px}.node.active .circle{background:#ffe498;transform:scale(1.08)}.node.done .circle{background:#c8f3da}.path{height:6px;min-width:42px;background:#bad0e7;border-radius:9px}.battle{background:linear-gradient(#dff3ff,#fff1c9);border-radius:22px;padding:18px;min-height:430px}.monster{text-align:center;font-size:80px}.hp{height:15px;background:#e5e7eb;border-radius:99px;overflow:hidden}.hp>div{height:100%;background:#ef4444;transition:.3s}.question{font-size:clamp(22px,4vw,31px);font-weight:900;text-align:center;margin:18px 0;line-height:1.5}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.answers{grid-template-columns:1fr}}.ans{background:#fff;border:2px solid #cfe0f7;border-radius:15px;padding:14px;font-weight:800}.ans.ok{background:#dcfce7;border-color:#22c55e}.ans.bad{background:#fee2e2;border-color:#ef4444}.toast{text-align:center;font-weight:800;min-height:26px;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:center}th{background:#eff6ff}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#fff2be;font-weight:800}.smallbtn{padding:6px 9px;border-radius:9px;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#eef5ff;color:#1e40af}.tabs button.active{background:#2563eb;color:#fff}.kpi{font-size:28px;font-weight:900}.admin-section{border-top:1px dashed #cbd5e1;padding-top:14px;margin-top:16px}.loginbox{max-width:420px;margin:40px auto}.session{padding:8px 12px;background:#ecfdf5;border:1px solid #bbf7d0;border-radius:12px;margin:10px 0;font-size:14px}
</style>
</head>
<body><div class="app">
<header class="hero"><h1>⚔️ 興嘉學習大冒險 V2.2</h1><p>安全登入版｜前端不保存教師或管理者密碼</p></header>
<div class="nav"><button onclick="go('home')">🏠 首頁</button><button onclick="go('rank');loadRemoteRanks()">🏆 榮譽榜</button><button onclick="showStaffLogin('teacher')">🧑‍🏫 教師登入</button><button onclick="showStaffLogin('admin')">🛠️ 管理者登入</button><button id="logoutBtn" class="hidden" onclick="logout()">🚪 登出</button></div>
<div id="sessionInfo" class="session hidden"></div>
<section id="home"><div class="grid"><div class="card"><h2>🎒 冒險者登入</h2><label>班級</label><input id="cls" placeholder="例如 301"><label>姓名</label><input id="name" placeholder="例如 王小明"><label>科目</label><select id="subject" onchange="fillUnits()"></select><label>單元</label><select id="unit"></select><button class="primary" style="width:100%;margin-top:14px" onclick="begin()">🚀 進入冒險地圖</button></div><div class="card"><h2>🗺️ 冒險規則</h2><p>每答對一題就能攻擊怪物，連續答對會提高分數並獲得護盾。</p><p>最後一題為 Boss 關；單元全部答對，即可登上全對榮譽榜。</p><div style="font-size:68px;text-align:center">🏫 ➜ 🌲 ➜ ⚔️ ➜ 🐉 ➜ 🏆</div></div></div></section>
<section id="staffLogin" class="hidden"><div class="card loginbox"><h2 id="loginTitle">教師登入</h2><input id="loginRole" type="hidden"><label>帳號</label><input id="staffUser" autocomplete="username"><label>密碼</label><input id="staffPass" type="password" autocomplete="current-password"><button class="primary" style="width:100%;margin-top:14px" onclick="staffLogin()">登入</button><p class="muted">帳號與密碼送至 Google Apps Script 驗證，前端不保存密碼。</p></div></section>
<section id="game" class="hidden"><div class="stats"><div class="stat">👤 玩家<b id="who"></b></div><div class="stat">❤️ 生命<b id="life"></b></div><div class="stat">⭐ 分數<b id="score"></b></div><div class="stat">🔥 連擊<b id="combo"></b></div><div class="stat">🪙 金幣<b id="coin"></b></div><div class="stat">🛡️ 護盾<b id="shield"></b></div></div><div class="card"><b id="gameTitle"></b><div id="map" class="map"></div></div><div class="battle"><div id="monster" class="monster">👾</div><div class="hp"><div id="mhp"></div></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="toast" class="toast"></div></div></section>
<section id="result" class="hidden"><div class="card" style="text-align:center"><div id="resultIcon" style="font-size:80px">🏆</div><h2 id="resultTitle"></h2><p id="resultText"></p><button class="primary" onclick="go('home')">回首頁</button> <button class="gold" onclick="begin()">再挑戰</button></div></section>
<section id="rank" class="hidden"><div class="card"><div class="toolbar"><h2 style="margin:0">🏆 全對榮譽榜</h2><button class="soft" onclick="loadRemoteRanks()">🔄 更新</button></div><div id="rankBox"></div></div></section>
<section id="teacher" class="hidden"><div class="card"><h2>🧑‍🏫 教師專區</h2><div class="tabs"><button class="active" onclick="showTeacherTab('qbank',this)">題庫</button><button onclick="showTeacherTab('students',this)">學生名單</button><button onclick="showTeacherTab('stats',this)">統計</button></div><div id="tab-qbank"><div class="toolbar"><input type="file" id="bankFile" accept=".json"><button class="gold" onclick="importBank()">匯入 JSON</button><button class="soft" onclick="exportBank()">匯出題庫</button></div><div class="admin-section"><h3>➕ 新增題目</h3><div class="grid"><div><label>科目</label><input id="newSubject"></div><div><label>單元</label><input id="newUnit"></div></div><label>題目</label><input id="newQ"><label>選項（每行一個）</label><textarea id="newOpts" rows="4"></textarea><label>正確答案</label><input id="newAns"><button class="green" style="margin-top:10px" onclick="addQuestionRemote()">新增題目</button></div></div><div id="tab-students" class="hidden"><div class="toolbar"><input type="file" id="studentFile" accept=".csv,.json"><button class="gold" onclick="importStudentsRemote()">匯入學生名單</button><button class="soft" onclick="downloadStudentSample()">下載 CSV 範例</button></div><div id="studentTable" style="margin-top:12px"></div></div><div id="tab-stats" class="hidden"><div class="grid3"><div class="card"><div class="muted">全對人次</div><div id="kpiTotal" class="kpi">0</div></div><div class="card"><div class="muted">參與班級</div><div id="kpiClass" class="kpi">0</div></div><div class="card"><div class="muted">科目數</div><div id="kpiSubject" class="kpi">0</div></div></div><div id="statsBox"></div></div></div></section>
<section id="admin" class="hidden"><div class="card"><h2>🛠️ 管理者最高權限</h2><div class="admin-section"><h3>📚 題庫管理</h3><div id="adminBank"></div></div><div class="admin-section"><h3>🏆 榮譽榜管理</h3><button class="soft" onclick="loadRemoteRanks(true)">更新資料</button><div id="adminRank"></div></div></div></section>
</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbyxec9bqPFTVCrzezDWAMSDp0q5pdQxTcE54inQWmGt1nhnIAyqELpoEDfnP2pU3-g9jQ/exec';
let session={token:'',role:'',username:''},bank={subjects:[]},students=[],remoteRanks=[],state={};const $=id=>document.getElementById(id);
function go(id){['home','staffLogin','game','result','rank','teacher','admin'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');if(id==='rank')renderRank()}
async function init(){await loadPublicBank();fillSubjects();await loadRemoteRanks()}
function showStaffLogin(role){$('loginRole').value=role;$('loginTitle').textContent=role==='admin'?'管理者登入':'教師登入';$('staffUser').value='';$('staffPass').value='';go('staffLogin')}
async function staffLogin(){let role=$('loginRole').value,user=$('staffUser').value.trim(),pass=$('staffPass').value;if(!user||!pass)return alert('請輸入帳號與密碼');let r=await apiPost({action:'login',role,username:user,password:pass});if(!r.ok)return alert(r.message||'登入失敗');session={token:r.token,role:r.role,username:r.username};$('logoutBtn').classList.remove('hidden');$('sessionInfo').classList.remove('hidden');$('sessionInfo').textContent=`已登入：${session.username}（${session.role==='admin'?'管理者':'教師'}）`;if(role==='admin'){await loadAdminData();go('admin')}else{await loadTeacherData();go('teacher')}}
function logout(){session={token:'',role:'',username:''};$('logoutBtn').classList.add('hidden');$('sessionInfo').classList.add('hidden');go('home')}
async function loadPublicBank(){try{let r=await fetch(GAS_URL+'?action=getPublicBank&_='+Date.now()).then(x=>x.json());if(r.ok&&r.bank)bank=r.bank}catch(e){bank={subjects:[]}}}
function fillSubjects(){$('subject').innerHTML=(bank.subjects||[]).map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join('');fillUnits()}
function fillUnits(){let s=bank.subjects[+$('subject').value||0];$('unit').innerHTML=(s?.units||[]).map((u,i)=>`<option value="${i}">${esc(u.name)}</option>`).join('')}
function begin(){let cls=$('cls').value.trim(),name=$('name').value.trim();if(!cls||!name)return alert('請輸入班級與姓名');let s=bank.subjects[+$('subject').value],u=s?.units[+$('unit').value];if(!u?.questions?.length)return alert('這個單元沒有題目');state={cls,name,subject:s.name,unit:u.name,qs:shuffle(JSON.parse(JSON.stringify(u.questions))),i:0,life:3,score:0,combo:0,coin:0,shield:0,perfect:true,locked:false};go('game');draw()}
function draw(){if(state.i>=state.qs.length||state.life<=0)return finish();$('who').textContent=state.cls+' '+state.name;$('life').textContent=state.life;$('score').textContent=state.score;$('combo').textContent=state.combo;$('coin').textContent=state.coin;$('shield').textContent=state.shield;$('gameTitle').textContent=state.subject+'｜'+state.unit;$('monster').textContent=state.i===state.qs.length-1?'🐉':['👾','👹','🐺','🦂'][state.i%4];$('mhp').style.width='100%';drawMap();let q=state.qs[state.i];$('q').textContent=q.question;$('toast').textContent='';$('answers').innerHTML='';shuffle([...q.options]).forEach(o=>{let b=document.createElement('button');b.className='ans';b.textContent=o;b.onclick=()=>answer(b,o,q.answer);$('answers').appendChild(b)});state.locked=false}
function drawMap(){let html='';state.qs.forEach((_,i)=>{if(i)html+='<div class="path"></div>';html+=`<div class="node ${i<state.i?'done':i===state.i?'active':''}"><div class="circle">${i===state.qs.length-1?'🐉':i<state.i?'✓':'⚔️'}</div><small>${i===state.qs.length-1?'Boss':'關卡 '+(i+1)}</small></div>`});$('map').innerHTML=html}
function answer(btn,sel,ans){if(state.locked)return;state.locked=true;[...document.querySelectorAll('.ans')].forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add('ok')});if(sel===ans){state.combo++;state.score+=100+(state.combo-1)*20;state.coin+=10;if(state.combo%3===0)state.shield++;$('mhp').style.width='0%';$('toast').textContent=state.i===state.qs.length-1?'⚔️ Boss 擊破！':'⚔️ 攻擊成功！'}else{btn.classList.add('bad');state.perfect=false;state.combo=0;if(state.shield>0){state.shield--;$('toast').textContent='🛡️ 護盾擋下傷害！'}else{state.life--;$('toast').textContent='💥 正確答案：'+ans}}setTimeout(()=>{state.i++;draw()},900)}
function finish(){go('result');let complete=state.i>=state.qs.length,perfect=complete&&state.perfect;if(perfect){$('resultIcon').textContent='🏆';$('resultTitle').textContent='完美通關！';$('resultText').textContent=`${state.cls} ${state.name} 全部答對，獲得 ${state.score} 分！`;savePerfect()}else if(complete){$('resultIcon').textContent='🎉';$('resultTitle').textContent='冒險完成！';$('resultText').textContent=`本次獲得 ${state.score} 分。`}else{$('resultIcon').textContent='💫';$('resultTitle').textContent='冒險暫時結束';$('resultText').textContent=`本次獲得 ${state.score} 分。`}}
async function savePerfect(){try{await apiPost({action:'addRank',record:{className:state.cls,name:state.name,subject:state.subject,unit:state.unit,score:state.score}});await loadRemoteRanks()}catch(e){}}
async function loadRemoteRanks(forAdmin=false){try{let r=await fetch(GAS_URL+'?action=getRanks&_='+Date.now()).then(x=>x.json());if(r.ok)remoteRanks=r.ranks||[];renderRank();renderStats();if(forAdmin)renderAdminRank()}catch(e){}}
function renderRank(){$('rankBox').innerHTML=remoteRanks.length?`<div style="overflow:auto"><table><tr><th>#</th><th>班級</th><th>姓名</th><th>科目</th><th>單元</th><th>分數</th><th>日期</th></tr>${remoteRanks.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.className)}</td><td>${esc(r.name)}</td><td>${esc(r.subject)}</td><td>${esc(r.unit)}</td><td><span class="tag">${r.score}</span></td><td>${esc(r.date)}</td></tr>`).join('')}</table></div>`:'<p>目前還沒有完美通關紀錄。</p>'}
function showTeacherTab(tab,btn){['qbank','students','stats'].forEach(x=>$('tab-'+x).classList.add('hidden'));$('tab-'+tab).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(tab==='students')renderStudents();if(tab==='stats')renderStats()}
async function loadTeacherData(){await Promise.all([loadStaffBank(),loadStudents(),loadRemoteRanks()])}async function loadAdminData(){await Promise.all([loadStaffBank(),loadStudents(),loadRemoteRanks(true)])}
async function loadStaffBank(){let r=await authedPost({action:'getBank'});if(r.ok&&r.bank){bank=r.bank;fillSubjects();renderAdminBank()}}
async function loadStudents(){let r=await authedPost({action:'getStudents'});if(r.ok){students=r.students||[];renderStudents()}}
async function importBank(){let f=$('bankFile').files[0];if(!f)return alert('請選擇 JSON');try{let data=JSON.parse(await f.text());let r=await authedPost({action:'replaceBank',bank:data});if(r.ok){bank=data;fillSubjects();renderAdminBank();alert('題庫已更新')}else alert(r.message||'失敗')}catch(e){alert('匯入失敗：'+e.message)}}
function exportBank(){download('xingjia-question-bank.json',JSON.stringify(bank,null,2),'application/json')}
async function addQuestionRemote(){let payload={action:'addQuestion',subject:$('newSubject').value.trim(),unit:$('newUnit').value.trim(),question:$('newQ').value.trim(),options:$('newOpts').value.split(/\n/).map(x=>x.trim()).filter(Boolean),answer:$('newAns').value.trim()};let r=await authedPost(payload);if(r.ok){await loadStaffBank();alert('新增完成')}else alert(r.message||'新增失敗')}
function renderAdminBank(){if(!session.token)return;let html='';(bank.subjects||[]).forEach(s=>{html+=`<div class="card"><b>📘 ${esc(s.name)}</b>${session.role==='admin'?` <button class="smallbtn danger" onclick="deleteSubject('${escAttr(s.name)}')">刪除科目</button>`:''}`;s.units.forEach(u=>{html+=`<div style="margin:10px 0 0 20px"><b>${esc(u.name)}</b>${session.role==='admin'?` <button class="smallbtn danger" onclick="deleteUnit('${escAttr(s.name)}','${escAttr(u.name)}')">刪除單元</button>`:''}<div class="muted">題數：${u.questions.length}</div>`;u.questions.forEach(q=>{html+=`<div style="margin:6px 0;padding:8px;background:#f8fbff;border-radius:10px">${esc(q.question)}${session.role==='admin'?`<button class="smallbtn danger" style="float:right" onclick="deleteQuestion('${escAttr(s.name)}','${escAttr(u.name)}','${escAttr(q.question)}')">刪除</button>`:''}</div>`});html+='</div>'});html+='</div>'});$('adminBank').innerHTML=html}
async function deleteSubject(subject){if(!confirm('確定刪除整個科目？'))return;let r=await authedPost({action:'deleteSubject',subject});if(r.ok)await loadStaffBank();else alert(r.message||'刪除失敗')}async function deleteUnit(subject,unit){if(!confirm('確定刪除此單元？'))return;let r=await authedPost({action:'deleteUnit',subject,unit});if(r.ok)await loadStaffBank();else alert(r.message||'刪除失敗')}async function deleteQuestion(subject,unit,question){if(!confirm('確定刪除此題？'))return;let r=await authedPost({action:'deleteQuestion',subject,unit,question});if(r.ok)await loadStaffBank();else alert(r.message||'刪除失敗')}
async function importStudentsRemote(){let f=$('studentFile').files[0];if(!f)return alert('請選擇 CSV 或 JSON');let arr=[];try{if(f.name.toLowerCase().endsWith('.json'))arr=JSON.parse(await f.text());else{let t=await f.text(),ls=t.replace(/\r/g,'').split('\n').filter(Boolean),h=ls[0].split(',').map(x=>x.trim()),ci=h.indexOf('班級'),ni=h.indexOf('姓名');if(ci<0||ni<0)throw Error('CSV 需有班級、姓名欄位');arr=ls.slice(1).map(line=>{let c=parseCSVLine(line);return{className:c[ci],name:c[ni]}})}let r=await authedPost({action:'replaceStudents',students:arr});if(r.ok){students=arr;renderStudents();alert('學生名單已更新')}else alert(r.message||'失敗')}catch(e){alert('匯入失敗：'+e.message)}}
function renderStudents(){$('studentTable').innerHTML=students.length?`<div style="overflow:auto"><table><tr><th>#</th><th>班級</th><th>姓名</th></tr>${students.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.className)}</td><td>${esc(s.name)}</td></tr>`).join('')}</table></div>`:"<p class='muted'>尚無學生名單。</p>"}
function downloadStudentSample(){download('student-sample.csv','班級,姓名\n301,王小明\n301,李小華\n','text/csv;charset=utf-8')}
function parseCSVLine(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function renderStats(){$('kpiTotal').textContent=remoteRanks.length;$('kpiClass').textContent=new Set(remoteRanks.map(x=>x.className)).size;$('kpiSubject').textContent=new Set(remoteRanks.map(x=>x.subject)).size;let bc={},bs={},bu={};remoteRanks.forEach(r=>{bc[r.className]=(bc[r.className]||0)+1;bs[r.subject]=(bs[r.subject]||0)+1;bu[r.subject+'｜'+r.unit]=(bu[r.subject+'｜'+r.unit]||0)+1});let rows=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');$('statsBox').innerHTML=`<div class="grid3"><div class="card"><h3>班級</h3><table>${rows(bc)}</table></div><div class="card"><h3>科目</h3><table>${rows(bs)}</table></div><div class="card"><h3>單元</h3><table>${rows(bu)}</table></div></div>`}
function renderAdminRank(){$('adminRank').innerHTML=remoteRanks.length?`<div style="overflow:auto"><table><tr><th>#</th><th>班級</th><th>姓名</th><th>科目</th><th>單元</th><th>分數</th><th>操作</th></tr>${remoteRanks.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.className)}</td><td>${esc(r.name)}</td><td>${esc(r.subject)}</td><td>${esc(r.unit)}</td><td>${r.score}</td><td><button class="smallbtn danger" onclick="deleteRank('${escAttr(r.id)}')">刪除</button></td></tr>`).join('')}</table></div>`:'<p>尚無資料。</p>'}
async function deleteRank(id){if(!confirm('確定刪除？'))return;let r=await authedPost({action:'deleteRank',id});if(r.ok)await loadRemoteRanks(true);else alert(r.message||'刪除失敗')}
async function apiPost(payload){let res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return await res.json()}async function authedPost(payload){payload.token=session.token;return await apiPost(payload)}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(x){return String(x??'').replace(/['"\\]/g,'')}
init();
</script></body></html>
